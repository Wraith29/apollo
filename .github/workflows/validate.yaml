name: Validate

on:
  workflow_call:
  pull_request:

jobs:
  run-validation:
    name: Validate code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tools
        uses: jdx/mise-action@v4

      - name: Run linting
        run: pnpm run lint-ci

      - name: Install build dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm run build
