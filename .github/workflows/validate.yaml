name: Validate

on:
  workflow_call:
  pull_request:

jobs:
  run-validation:
    name: Validate code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: jdx/mise-action@v4

      - name: Run linting
        run: bun run lint
